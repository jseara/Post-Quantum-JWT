# nginx configuration template; scripts/transport_stack.py replaces the @NAME@ tokens and writes
# the result to <run_dir>/nginx/nginx.conf. No header-, cookie-, line-, or buffer-size directive
# (client_header_buffer_size, large_client_header_buffers, proxy_buffer_size, proxy_buffers, ...)
# is set, so nginx's documented defaults apply. Every runtime path points into the run directory.

daemon off;
pid "/tmp/transport-stack-dm8v637n/nginx/nginx.pid";
lock_file "/tmp/transport-stack-dm8v637n/nginx/nginx.lock";
# info level records "client sent too long header line" rejections.
error_log "/tmp/transport-stack-dm8v637n/logs/proxy-error.log" info;
# The conda-forge osx-arm64 build passes kevent() a timeout with tv_nsec shifted left 32 bits
# (NGX_DARWIN_KEVENT_BUG), which fails with EINVAL in a busy loop while a keep-alive connection
# waits. With a timer resolution nginx waits without a timeout. Harmless on Linux.
timer_resolution 100ms;

events {
}

http {
    log_format transport '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'request_length=$request_length upstream_status=$upstream_status';
    access_log "/tmp/transport-stack-dm8v637n/logs/proxy-access.log" transport;

    client_body_temp_path "/tmp/transport-stack-dm8v637n/nginx/client_body_temp";
    proxy_temp_path "/tmp/transport-stack-dm8v637n/nginx/proxy_temp";
    fastcgi_temp_path "/tmp/transport-stack-dm8v637n/nginx/fastcgi_temp";
    uwsgi_temp_path "/tmp/transport-stack-dm8v637n/nginx/uwsgi_temp";
    scgi_temp_path "/tmp/transport-stack-dm8v637n/nginx/scgi_temp";

    server {
        listen 127.0.0.1:57259 ssl;
        # Not a default: --protocol h2.
        ssl_certificate "/tmp/transport-stack-dm8v637n/tls/certificate.pem";
        ssl_certificate_key "/tmp/transport-stack-dm8v637n/tls/experiment-key.pem";
        http2 on;

        location / {
            proxy_pass http://127.0.0.1:56017;
            # "always" also marks forwarded error responses such as 404.
            add_header X-Transport-Proxy "nginx" always;
        }
    }
}
